name: Windows build

on:
  push:
    branches: [steam-frame-reset-logging]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
          cache: true

      - name: Install jom
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.qt.io/official_releases/jom/jom.zip -OutFile jom.zip
          Expand-Archive jom.zip "$env:RUNNER_TEMP\jom"
          "$env:RUNNER_TEMP\jom" | Out-File -Append $env:GITHUB_PATH

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          qmake -spec win32-msvc CONFIG+=X86_64 CONFIG+=release
          jom

      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedSettings-win64
          path: bin/win64/AdvancedSettings
