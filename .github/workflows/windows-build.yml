name: Windows build

on:
  push:
    branches: [steam-frame-reset-logging]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          qmake -spec win32-msvc CONFIG+=X86_64 CONFIG+=release
          nmake

      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedSettings-win64
          path: bin/win64/AdvancedSettings
